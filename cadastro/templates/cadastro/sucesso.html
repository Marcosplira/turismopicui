<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro enviado</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100">

    <main class="min-h-screen flex items-center justify-center px-6">

        <div class="bg-white max-w-lg w-full
                    rounded-2xl shadow-lg p-8 text-center">

            <div class="text-5xl mb-5">
                ✓
            </div>

            <h1 class="text-2xl font-bold text-gray-800">

                Cadastro enviado com sucesso!

            </h1>

            <p class="text-gray-600 mt-4">

                As informações foram recebidas.
                A equipe responsável pelo Turismo de Picuí
                irá analisar o cadastro.

            </p>

            <a
                href="{% url 'cadastrar_empreendimento' %}"
                class="inline-block mt-8 bg-green-700
                       hover:bg-green-800 text-white
                       font-bold px-6 py-3 rounded-lg">

                Fazer outro cadastro

            </a>

            <a
                href="{% url 'minha_area' %}"
                class="inline-block mt-4 border border-green-700
                       text-green-700 hover:bg-green-50
                       font-bold px-6 py-3 rounded-lg">
                Acessar meus dados
            </a>

            <div class="mt-6 text-sm text-gray-500">
                <a href="https://www.picui.pb.gov.br/" target="_blank" rel="noopener noreferrer" class="text-green-700 underline">
                    Site da Prefeitura
                </a>
                <span class="mx-2">|</span>
                <a href="https://www.instagram.com/prefeituradepicuioficial/" target="_blank" rel="noopener noreferrer" class="text-green-700 underline">
                    Instagram oficial
                </a>
                <span class="mx-2">|</span>
                <a href="https://heyzine.com/flip-book/e975954570.html" target="_blank" rel="noopener noreferrer" class="text-green-700 underline">
                    Revista turística
                </a>
            </div>

        </div>

    </main>

</body>

</html>
