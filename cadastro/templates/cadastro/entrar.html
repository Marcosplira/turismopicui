<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso do responsável - Turismo de Picuí</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-6">
    <main class="bg-white rounded-2xl shadow-lg p-8 max-w-md w-full">
        <p class="text-green-700 font-semibold">Turismo de Picuí</p>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">Acesso do responsável</h1>
        <p class="text-gray-600 mt-2">Consulte os dados enviados do seu empreendimento.</p>
        {% if messages %}{% for message in messages %}<p class="mt-4 p-3 rounded-lg bg-red-100 text-red-700">{{ message }}</p>{% endfor %}{% endif %}
        <form method="post" class="mt-6 space-y-4">
            {% csrf_token %}
            <label class="block"><span class="field-label">E-mail</span><input type="email" name="email" required class="w-full border border-gray-300 rounded-lg p-3"></label>
            <label class="block"><span class="field-label">Senha</span><input type="password" name="senha" required class="w-full border border-gray-300 rounded-lg p-3"></label>
            <button class="w-full bg-green-700 hover:bg-green-800 text-white font-bold px-6 py-3 rounded-lg">Entrar</button>
        </form>
        <a href="{% url 'home' %}" class="block text-center text-green-700 underline mt-5">Voltar para a página inicial</a>
    </main>
</body>
</html>
