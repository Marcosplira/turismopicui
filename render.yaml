databases:
  - name: turismo-picui-db
    databaseName: turismo_picui
    user: turismo_picui
    plan: free

services:
  - type: web
    name: turismo-picui
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: turismo-picui-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "turismo-picui.onrender.com,turismo.picui.pb.gov.br,www.turismo.picui.pb.gov.br,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "[https://turismo-picui.onrender.com](https://turismo-picui.onrender.com),[https://turismo.picui.pb.gov.br](https://turismo.picui.pb.gov.br),[https://www.turismo.picui.pb.gov.br](https://www.turismo.picui.pb.gov.br)"
