databases:
  - name: turismo-picui-db
    databaseName: turismo_picui
    user: turismo_picui
    plan: free

services:
  - type: web
    name: turismo-picui
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: turismo-picui-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://turismo-picui.onrender.com"
